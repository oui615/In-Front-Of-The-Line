!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In Front Of The Line</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
 
:root{
  --bg:#160d0c; --bg2:#0c0a14;
  --panel:#241715; --panel-2:#2e1c19; --line:#5a3a26;
  --text:#f1e6d3; --muted:#c2a98f; --brass:#e0b23d; --brass-glow:rgba(224,178,61,.45);
  --olive:#8a9b5e; --warn:#e08e3e;
  --p1:#4f8fd1; --p1-glow:rgba(79,143,209,.4);
  --p2:#d64545; --p2-glow:rgba(214,69,69,.4);
  --spell:#b98fe0;
  --ember:#ff7a3d;
  --deepblue:#1c2f57; --deepblue-glow:rgba(45,90,171,.35);
  --violet:#3a1f56; --violet-glow:rgba(133,66,199,.32);
}
*{box-sizing:border-box;}
body{margin:0;color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;line-height:1.55;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(224,178,61,.10), transparent 60%),
    radial-gradient(ellipse 900px 600px at 100% 0%, rgba(214,69,69,.14), transparent 55%),
    radial-gradient(ellipse 800px 700px at 0% 100%, var(--deepblue-glow), transparent 60%),
    radial-gradient(ellipse 900px 700px at 105% 105%, var(--violet-glow), transparent 58%),
    radial-gradient(ellipse 1200px 800px at 50% 110%, rgba(90,58,38,.22), transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  background-attachment:fixed;
}
h1,h2,h3,.disp{font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.03em;}
.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 70px;}
.embers{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.ember-dot{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:var(--ember);box-shadow:0 0 6px 1px var(--ember);opacity:0;animation:emberRise linear infinite;}
@keyframes emberRise{ 0%{opacity:0; transform:translateY(0) translateX(0);} 8%{opacity:.85;} 90%{opacity:.5;} 100%{opacity:0; transform:translateY(-100vh) translateX(var(--drift,20px));} }
@keyframes popIn{ from{opacity:0; transform:scale(.4);} to{opacity:1; transform:scale(1);} }
@keyframes fadeSlide{ from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);} }
@keyframes shake{ 10%,90%{transform:translateX(-1px);} 20%,80%{transform:translateX(2px);} 30%,50%,70%{transform:translateX(-5px);} 40%,60%{transform:translateX(5px);} }
.screen-shake{ animation: shake .4s; }
@keyframes unitHit{ 0%{filter:brightness(1) saturate(1);} 20%{filter:brightness(2.4) saturate(1.6) drop-shadow(0 0 7px #ff3b3b);transform:scale(1.2);} 100%{filter:brightness(1) saturate(1);transform:scale(1);} }
.unit.unit-hit{ animation: unitHit .5s ease; z-index:2; }
@keyframes unitBlocked{ 0%{filter:brightness(1);} 25%{filter:brightness(1.8) drop-shadow(0 0 8px var(--spell));transform:scale(1.15);} 100%{filter:brightness(1);transform:scale(1);} }
.unit.unit-blocked{ animation: unitBlocked .5s ease; z-index:2; }
@keyframes unitAttack{ 0%{transform:translateY(0) scale(1);} 35%{transform:translateY(-5px) scale(1.12);} 100%{transform:translateY(0) scale(1);} }
.unit.unit-attack{ animation: unitAttack .32s ease; }
@keyframes unitMoved{ 0%{box-shadow:0 0 0 0 var(--brass-glow);} 55%{box-shadow:0 0 12px 4px var(--brass-glow);} 100%{box-shadow:0 0 0 0 transparent;} }
.unit.unit-moved{ animation: unitMoved .6s ease; }
@keyframes baseHitFx{ 0%{box-shadow:none;} 25%{box-shadow:0 0 20px 5px rgba(255,60,60,.75);} 100%{box-shadow:none;} }
.baserow.base-hit{ animation: baseHitFx .55s ease; }
@keyframes handDrawn{ 0%{box-shadow:0 0 0 0 var(--brass-glow);border-radius:10px;} 40%{box-shadow:0 0 16px 5px var(--brass-glow);border-radius:10px;} 100%{box-shadow:0 0 0 0 transparent;border-radius:10px;} }
.hand.hand-drawn{ animation: handDrawn .8s ease; }
@keyframes pulseLow{ 0%,100%{box-shadow:0 0 0 rgba(214,69,69,0);} 50%{box-shadow:0 0 10px 1px rgba(214,69,69,.7);} }
.pvbar.low{ animation: pulseLow 1.1s infinite; }
@keyframes bannerShimmer{ 0%{background-position:0% 50%;} 100%{background-position:200% 50%;} }
@keyframes victoryPop{ from{transform:scale(.7); opacity:0;} to{transform:scale(1); opacity:1;} }
.wrap{position:relative;z-index:1;}
header.top{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 24px;margin-bottom:24px;flex-wrap:wrap;gap:14px;
  background:linear-gradient(135deg, rgba(46,28,25,.9), rgba(36,23,21,.75));
  border:1px solid var(--line); border-bottom:2px solid var(--brass);
  border-radius:10px;
  box-shadow:0 4px 24px rgba(0,0,0,.4), inset 0 1px 0 rgba(224,178,61,.15);
  position:relative; overflow:hidden;
}
header.top::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg, transparent 0%, rgba(224,178,61,.12) 45%, transparent 55%, transparent 100%);background-size:200% 100%;animation:bannerShimmer 6s linear infinite;pointer-events:none;}
header.top .brand h1{font-size:30px;margin:0;color:var(--brass);text-transform:uppercase;text-shadow:0 0 18px rgba(224,178,61,.35);}
header.top .brand p{margin:2px 0 0;color:var(--muted);font-size:13px;}
.turnbadge{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;box-shadow:inset 0 0 12px rgba(0,0,0,.3);}
.turnbadge .dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 8px 1px currentColor;}
.turnbadge.p1 .dot{background:var(--p1);color:var(--p1);} .turnbadge.p2 .dot{background:var(--p2);color:var(--p2);}
.turnbadge b{font-family:'Rajdhani',sans-serif;font-size:15px;}
.turnbadge span.round, .turnbadge span.timer{color:var(--muted);font-size:12px;}
.turnbadge span.timer.warn{color:var(--p2);font-weight:700;}
 
.setup-card{background:linear-gradient(160deg, var(--panel), var(--panel-2));border:1px solid var(--line);border-top:2px solid var(--deepblue);border-radius:10px;padding:32px;max-width:680px;margin:36px auto;box-shadow:0 8px 30px rgba(0,0,0,.4);}
.setup-card h2{margin-top:0;color:var(--brass);font-size:22px;}
.setup-card p{color:var(--muted);font-size:14px;line-height:1.6;}
.choice-row{display:flex;gap:14px;margin:18px 0;flex-wrap:wrap;}
.choice{flex:1;min-width:140px;background:var(--panel-2);border:2px solid var(--line);border-radius:8px;padding:18px;cursor:pointer;text-align:center;transition:all .18s;}
.choice:hover{border-color:var(--olive);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.35);}
.choice.selected{border-color:var(--brass);background:rgba(224,178,61,.12);box-shadow:0 0 0 1px var(--brass), 0 0 16px var(--brass-glow);}
.choice .icon{font-size:26px;display:block;margin-bottom:6px;}
.choice b{display:block;font-family:'Rajdhani',sans-serif;font-size:16px;}
.choice small{color:var(--muted);}
.btn{background:linear-gradient(160deg,#f0c860,var(--brass) 60%,#b8891f);color:#211705;border:1px solid rgba(0,0,0,.25);border-radius:6px;padding:12px 24px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;letter-spacing:.03em;cursor:pointer;text-transform:uppercase;box-shadow:0 3px 10px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.3);transition:all .15s;}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(0,0,0,.4), 0 0 14px var(--brass-glow), inset 0 1px 0 rgba(255,255,255,.35);}
.btn:active{transform:translateY(0);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
.btn.secondary{background:transparent;border:1px solid var(--olive);color:var(--olive);box-shadow:none;}
.btn.secondary:hover{box-shadow:0 0 10px rgba(138,155,94,.35);}
.btn.spellbtn{border:1px solid var(--spell);color:var(--spell);background:transparent;box-shadow:none;}
.btn.spellbtn:hover{box-shadow:0 0 10px rgba(185,143,224,.4);}
.btn.small{padding:6px 12px;font-size:12px;}
.varbox{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:18px;margin:18px 0;}
.varbox h4{margin:0 0 12px;font-size:14px;color:var(--brass);}
label.opt{display:flex;align-items:center;gap:8px;color:var(--text);font-size:13.5px;margin:12px 0;}
label.opt small{color:var(--muted);display:block;margin-left:26px;font-size:12px;}
select,input[type=number]{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:4px 8px;}
 
.overlay{position:fixed;inset:0;background:#0c0e11;display:flex;align-items:center;justify-content:center;z-index:50;flex-direction:column;gap:18px;text-align:center;padding:20px;}
.overlay h2{font-size:26px;color:var(--brass);margin:0;}
.overlay p{color:var(--muted);max-width:360px;}
 
.game{display:grid;grid-template-columns:1fr;gap:24px;}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;}
.pcard.active{border-color:var(--brass);}
.pcard h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px;}
.pcard h3 .sw{width:10px;height:10px;border-radius:50%;}
.pcard.p1 h3 .sw{background:var(--p1);} .pcard.p2 h3 .sw{background:var(--p2);}
.pts{font-family:'Rajdhani',sans-serif;font-size:22px;color:var(--brass);}
.bases{display:flex;gap:10px;margin-top:12px;}
.base-mini{flex:1;background:var(--panel-2);border-radius:6px;padding:8px 10px;font-size:11px;color:var(--muted);border-left:3px solid var(--line);}
.base-mini.small{border-left-color:#4aa863;background:rgba(74,168,99,.12);}
.base-mini.medium{border-left-color:#428ce0;background:rgba(66,140,224,.12);}
.base-mini.large{border-left-color:#db4545;background:rgba(219,69,69,.12);}
.base-mini b{display:block;color:var(--text);font-size:12px;margin-bottom:2px;}
.pvbar{height:5px;border-radius:3px;background:#3a4150;margin-top:6px;overflow:hidden;}
.pvbar i{display:block;height:100%;background:var(--olive);}
.pvbar.low i{background:var(--p2);}
 
.board-wrap{background:linear-gradient(160deg, var(--panel) 0%, #1a1730 100%);border:1px solid var(--line);border-radius:10px;padding:20px;overflow:auto;max-height:660px;box-shadow:inset 0 0 40px rgba(58,31,86,.25);}
.legend{display:flex;gap:18px;font-size:11px;color:var(--muted);margin-bottom:16px;flex-wrap:wrap;}
.legend span{display:flex;align-items:center;gap:6px;}
.legend i.box{width:10px;height:10px;display:inline-block;border-radius:2px;}
.board{display:grid;grid-template-columns:22px repeat(10,minmax(36px,1fr));grid-auto-rows:30px;gap:3px;min-width:480px;}
.colhead{display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--brass);font-family:'Rajdhani',sans-serif;font-weight:700;}
.rowlabel{display:flex;align-items:center;justify-content:center;font-size:8.5px;color:var(--muted);font-family:'Rajdhani',sans-serif;}
.cornercell{background:transparent;}
.baserow{grid-column:span 1;border-radius:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:9px;color:var(--muted);padding:4px;text-align:center;line-height:1.2;border-top-width:3px;border-top-style:solid;}
.baserow.small{background:rgba(74,168,99,.28);border:1px solid rgba(74,168,99,.65);border-top-color:#4aa863;}
.baserow.medium{background:rgba(66,140,224,.26);border:1px solid rgba(66,140,224,.65);border-top-color:#428ce0;}
.baserow.large{background:rgba(219,69,69,.26);border:1px solid rgba(219,69,69,.65);border-top-color:#db4545;}
.baserow b{color:var(--text);font-size:11px;}
.baserow .pvbar{width:80%;}
.cell{background:var(--panel-2);border-radius:4px;position:relative;display:flex;align-items:center;justify-content:center;}
.cell.zr-top{background:rgba(217,164,65,.10);}
.cell.zr-bot{background:rgba(217,164,65,.10);}
.cell.mid{border-top:1px dashed var(--line);}
.unit{width:25px;height:25px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;position:relative;border:1.5px solid;}
.unit.p1{border-color:var(--p1);background:var(--p1-glow);} .unit.p2{border-color:var(--p2);background:var(--p2-glow);}
.unit.shielded{box-shadow:0 0 0 2px var(--spell);}
.unit .pv{position:absolute;bottom:-7px;right:-4px;background:#0c0e11;border-radius:4px;padding:0 2px;font-size:7px;color:var(--text);}
.unit .lvl{position:absolute;top:-6px;left:-4px;background:var(--brass);color:#1a1607;border-radius:3px;padding:0 2px;font-size:6px;font-weight:700;}
 
.actionzone{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;}
.actionzone h3{margin:0 0 14px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.hand{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
.card{background:var(--panel-2);border:2px solid var(--line);border-radius:8px;padding:10px 14px;min-width:96px;cursor:pointer;text-align:center;transition:border-color .12s, transform .12s;animation:popIn .18s ease;}
.card:hover{transform:translateY(-2px);}
.card:hover{border-color:var(--olive);}
.card.selected{border-color:var(--brass);background:rgba(201,162,39,.1);}
.card.spell{border-color:rgba(155,127,199,.5);}
.card.spell.selected{border-color:var(--spell);background:rgba(155,127,199,.12);}
.card .ic{font-size:21px;}
.card b{display:block;font-family:'Rajdhani',sans-serif;font-size:12.5px;margin-top:4px;}
.card small{color:var(--muted);font-size:10.5px;display:block;margin-top:2px;}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.actions2{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding-top:14px;border-top:1px dashed var(--line);}
.subpanel{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px;}
.subpanel h4{margin:0 0 10px;font-size:13px;color:var(--brass);}
.subpanel h4.spellhead{color:var(--spell);}
.lanepick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.lanebtn{width:32px;height:32px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11px;cursor:pointer;font-family:'Rajdhani',sans-serif;}
.lanebtn.selected{border-color:var(--brass);color:var(--brass);}
.lanebtn:disabled{opacity:.3;cursor:not-allowed;}
.row-inline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
input[type=range]{accent-color:var(--brass);}
.abilitylist{display:flex;flex-direction:column;gap:12px;}
.abilityrow{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;}
.abilityrow .hd{display:flex;justify-content:space-between;align-items:center;font-family:'Rajdhani',sans-serif;font-size:13px;}
.abilityrow .desc{color:var(--muted);font-size:12px;margin:6px 0;line-height:1.5;}
 
.log{background:#0e1116;border:1px solid var(--line);border-radius:8px;padding:14px 16px;height:150px;overflow-y:auto;font-size:12.5px;color:var(--muted);line-height:1.7;}
.log div{padding:2px 0;}
.log b{color:var(--text);} .log .p1t{color:var(--p1);} .log .p2t{color:var(--p2);}
.endturn{display:flex;justify-content:flex-end;margin-top:16px;}
.winmodal{position:fixed;inset:0;background:rgba(8,9,11,.85);display:flex;align-items:center;justify-content:center;z-index:60;}
.winbox{background:linear-gradient(160deg, var(--panel), #201535);border:2px solid var(--brass);border-radius:12px;padding:34px;text-align:center;max-width:440px;box-shadow:0 0 60px var(--violet-glow);}
.winbox h2{font-size:28px;color:var(--brass);margin:0 0 10px;}
.winbox p{color:var(--muted);font-size:14px;}
.scoretable{display:flex;gap:14px;justify-content:center;margin:14px 0;}
.scorecol{background:var(--panel-2);border-radius:8px;padding:10px 16px;}
.scorecol b{display:block;font-family:'Rajdhani',sans-serif;font-size:22px;color:var(--brass);}
footer.note{margin-top:24px;color:var(--muted);font-size:12px;line-height:1.6;border-top:1px solid var(--line);padding-top:14px;}
.rules-wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:32px;max-width:900px;margin:0 auto;}
.rules-wrap h2{color:var(--brass);font-size:24px;margin:0 0 6px;}
.rules-wrap section{margin-bottom:32px;}
.rules-wrap section h3{color:var(--brass);font-size:17px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px;}
.rules-wrap p{color:var(--text);font-size:13.5px;line-height:1.7;}
.rules-wrap ul,.rules-wrap ol{color:var(--text);font-size:13.5px;line-height:1.8;padding-left:20px;}
.rules-wrap li{margin-bottom:5px;}
.badge{display:inline-block;font-size:10.5px;font-family:'Rajdhani',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:middle;}
.badge.official{background:rgba(124,138,85,.25);color:var(--olive);border:1px solid rgba(124,138,85,.5);}
.badge.homebrew{background:rgba(155,127,199,.2);color:var(--spell);border:1px solid rgba(155,127,199,.5);}
.ruletable{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;}
.ruletable th,.ruletable td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;color:var(--text);}
.ruletable th{color:var(--brass);font-family:'Rajdhani',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
.ruletable td.ic{font-size:16px;text-align:center;width:30px;}
.rulesbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.rules-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.rules-nav a{color:var(--muted);font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:14px;padding:4px 10px;}
.rules-nav a:hover{color:var(--brass);border-color:var(--brass);}
.recap-wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:30px;max-width:980px;margin:0 auto;}
.recap-wrap h2{color:var(--brass);font-size:22px;margin:0 0 4px;}
.recap-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;}
.recap-box{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:16px 18px;}
.recap-box h4{margin:0 0 10px;font-size:13px;color:var(--brass);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);padding-bottom:8px;}
.recap-box ol,.recap-box ul{margin:0;padding-left:18px;font-size:12px;line-height:1.7;color:var(--text);}
.recap-mini{width:100%;border-collapse:collapse;font-size:11px;}
.recap-mini th,.recap-mini td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;color:var(--text);}
.recap-mini th{color:var(--brass);font-weight:600;}
.recap-mini td.ic{width:20px;text-align:center;font-size:13px;}
.recap-full{grid-column:1 / -1;}
.keynums{display:flex;flex-wrap:wrap;gap:12px;}
.keynums div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:11.5px;color:var(--muted);}
.keynums div b{display:block;color:var(--brass);font-family:'Rajdhani',sans-serif;font-size:15px;margin-top:2px;}
@media print{
  body{background:#fff;color:#000;}
  .btn, .rules-nav, header.top button, .actionzone, .board-wrap, .panels, .log{display:none !important;}
  .recap-wrap, .rules-wrap{border:none;background:#fff;color:#000;max-width:100%;}
  .recap-box, .ruletable, .recap-mini{background:#fff;color:#000;}
  .recap-box{border:1px solid #999;}
  .recap-box h4,.rules-wrap h2,.rules-wrap section h3,.recap-mini th,.ruletable th{color:#000;}
  .keynums div{border:1px solid #999;color:#000;}
  .keynums div b{color:#000;}
}
@media(max-width:640px){ .panels{grid-template-columns:1fr;} header.top .brand h1{font-size:22px;} .recap-grid{grid-template-columns:1fr;} }
</style>

<body>
<div class="embers" id="embers"></div>
<div class="wrap" id="app"></div>
 
<script>
/* ============================================================
   IN FRONT OF THE LINE — moteur de jeu (v3)
   Plateau : 10 colonnes de large x 20 cases de long. Zone rouge : 4 cases.
   Capacités de troupes + Sorts : contenu inventé (non fourni par le
   livret de règles fourni, qui ne détaille que le mécanisme).
   ============================================================ */
 
const BOARD_LEN = 20;
const ZR_DEPTH = 4;
const MAX_ACTIVE_TROOPS = 8; // officiel : chaque joueur ne dispose que de 8 figurines / 8 pions PV pour ses troupes
 
const TROOPS = {

function levelForCount(c){ if(c>=8) return 4; if(c>=5) return 3; if(c>=3) return 2; return 1; }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }
function buildDeck(compTroops, includeExtras){
  const d=[];
  Object.entries(compTroops).forEach(([k,n])=>{ for(let i=0;i<n;i++) d.push(k); });
  if(includeExtras){
    CAPACITY_KEYS.forEach(k=>d.push(k)); // 50 cartes, 1 exemplaire chacune
    SPELL_KEYS.forEach(k=>{ const n=SPELLS[k].count; for(let i=0;i<n;i++) d.push(k); }); // 20 cartes
  }
  return shuffle(d);
}
 
function newPlayer(id, secretTarget, isBot){
  return { id, isBot, points:10, hand:[], secretTarget,
    bases:{ small:{pv:ZONES.small.pv,max:ZONES.small.pv,alive:true},
            medium:{pv:ZONES.medium.pv,max:ZONES.medium.pv,alive:true},
            large:{pv:ZONES.large.pv,max:ZONES.large.pv,alive:true} },
    units: new Array(10).fill(null),
  };
}
 
// Progression de Portée et de Cases/Tour selon le niveau (précisé par l'utilisateur) :
// - Portée : Lancier et Archer gagnent +1 à partir du Nv3, +1 de plus au Nv4.
//            Catapulte fait exception et progresse dès le Nv2 (+1 par niveau).
// - Cases/Tour : Cavalier, Cavalier d'Élite, Guérisseur et Barbare gagnent +1 à partir
//            du Nv3, +1 de plus au Nv4. Éclaireur et Soldat n'en bénéficient jamais.
function scaledRange(type, lvl, base){
  if(type==='lancier' || type==='archer') return base + (lvl>=4?2:(lvl>=3?1:0));
  if(type==='catapulte') return base + Math.max(0, lvl-1);
  return base;
}
function scaledMove(type, lvl, base){
  if(type==='cavalier' || type==='cavalierElite' || type==='guerisseur' || type==='barbare'){
    return base + (lvl>=4?2:(lvl>=3?1:0));
  }
  return base;
}
function unitStats(unit){
  const base = TROOPS[unit.type];
  const mult = LEVEL_MULT[unit.level];
  return { maxPv: Math.round(base.pv*mult), dmg: Math.round(base.dmg*mult),
    atk: base.atk,
    move: scaledMove(unit.type, unit.level, base.move),
    range: scaledRange(unit.type, unit.level, base.range),
    name: base.name, icon: base.icon };
}
 
function computedLevel(state, count){ return state.opts.simple ? 1 : levelForCount(count); }
function troopCost(state, type){ return state.opts.noPoints ? 0 : TROOPS[type].cost; }
 
function makeGame(mode, opts, p1Target, p2Target){
  const deck = buildDeck(opts.simple ? SIMPLE_COMPOSITION : DECK_COMPOSITION, !opts.simple);
  const p1 = newPlayer(0, p1Target, false);
  const p2 = newPlayer(1, p2Target, mode==="bot");
  if(opts.simple){ p1.hand.push(...SPELL_KEYS); p2.hand.push(...SPELL_KEYS); }
  const river = []; for(let i=0;i<4 && deck.length;i++) river.push(deck.pop()); // officiel : 4 cartes piochées et posées à côté de la pioche
  return {
    mode, opts, deck, river, players:[p1,p2], active:0, round:1,
    log:[], gameOver:false, winner:null, winReason:"", scoreBoard:null,
    pendingHandoff: mode==="2p", pendingExchanges:0,
    fx: { hits:new Set(), attacking:new Set(), moved:new Set(), baseHits:new Set(), blocked:new Set(), drew:new Set() },
    timerSeconds: opts.timer ? opts.timerMinutes*60 : null,
  };
}
 
function logMsg(state, html){ state.log.unshift(html); if(state.log.length>60) state.log.pop(); }
function drawCard(state, pid){ const pl=state.players[pid]; if(state.deck.length===0) return null; const c=state.deck.pop(); pl.hand.push(c); if(state.fx) state.fx.drew.add(pid); return c; }
 
function distanceToBase(pos, forPlayer){ return forPlayer===0 ? (BOARD_LEN-pos) : (pos+1); }
function inOwnDangerZone(pos, pid){ return distanceToBase(pos, pid) <= ZR_DEPTH; }
function effectiveRange(stats,unit){ const base = stats.range===0 ? 1 : stats.range; return base + (unit.tempRangeBonus||0); }
 
function findTarget(state, pid, lane){
  const opp = state.players[1-pid];
  const oppUnit = opp.units[lane];
  const myUnit = state.players[pid].units[lane];
  if(!myUnit) return null;
  if(oppUnit) return {type:"unit", dist: Math.abs(myUnit.pos-oppUnit.pos)};
  const zone = LANE_ZONE[lane];
  const base = opp.bases[zone];
  if(base && base.alive) return {type:"base", zone, dist: distanceToBase(myUnit.pos, pid)};
  return null;
}
 
function rollDice(state){
  if(!state.opts.dice) return {mult:1,label:""};
  const r = 1+Math.floor(Math.random()*6);
  if(r===1) return {mult:0, label:" (🎲1 — raté !)"};
  if(r===6) return {mult:1, label:" (🎲6 — critique +2 !)", bonus:2};
  return {mult:1, label:""};
}
 
function healUnit(state,pid,lane,amount){
  const pl=state.players[pid]; const u = lane===null||lane===undefined ? null : pl.units[lane];
  if(!u) return;
  const st=unitStats(u); const before=u.pv;
  u.pv=Math.min(st.maxPv,u.pv+amount);
  logMsg(state, `<b>Joueur ${pid+1}</b> soigne ${st.icon} ${st.name} (+${u.pv-before} PV).`);
}
 
function killUnit(state, ownerId, lane, killedByOpponent){
  const pl = state.players[ownerId];
  const unit = pl.units[lane];
  if(!unit) return;
  const stats = unitStats(unit);
  pl.units[lane]=null;
  pl.hand.push(unit.type);
  if(killedByOpponent && !state.opts.noPoints){
    const opp = state.players[1-ownerId];
    opp.points = Math.min(100, opp.points+2*unit.copies);
    logMsg(state, `<span class="${ownerId===0?'p1t':'p2t'}">${stats.icon} ${stats.name}</span> de <b>Joueur ${ownerId+1}</b> est achevé — <b>Joueur ${2-ownerId}</b> gagne ${2*unit.copies} PC.`);
  } else if(killedByOpponent){
    logMsg(state, `<span class="${ownerId===0?'p1t':'p2t'}">${stats.icon} ${stats.name}</span> de <b>Joueur ${ownerId+1}</b> est achevé.`);
  } else {
    logMsg(state, `<span class="${ownerId===0?'p1t':'p2t'}">${stats.icon} ${stats.name}</span> de <b>Joueur ${ownerId+1}</b> succombe à la zone rouge.`);
  }
}
 
function applyDamageToUnit(state, attackerId, lane, dmg){
  const opp = state.players[1-attackerId];
  const unit = opp.units[lane];
  if(!unit) return;
  if(unit.shield){
    unit.shield=false;
    const stats = unitStats(unit);
    logMsg(state, `🛡️✨ Le bouclier de ${stats.icon} ${stats.name} (Joueur ${2-attackerId}) absorbe l'attaque !`);
    if(state.fx) state.fx.blocked.add((1-attackerId)+'_'+lane);
    return;
  }
  unit.pv -= dmg;
  if(state.fx) state.fx.hits.add((1-attackerId)+'_'+lane);
  if(unit.pv<=0) killUnit(state, 1-attackerId, lane, true);
}
 
function applyDamageToBase(state, attackerId, zone, dmg){
  const opp = state.players[1-attackerId];
  const base = opp.bases[zone];
  if(!base || !base.alive) return;
  base.pv = Math.max(0, base.pv-dmg);
  if(state.fx) state.fx.baseHits.add((1-attackerId)+'_'+zone);
  logMsg(state, `<b>Joueur ${attackerId+1}</b> inflige ${dmg} dégâts à la <b>${ZONES[zone].name}</b> de Joueur ${2-attackerId} (${base.pv}/${base.max} PV).`);
  if(base.pv<=0){ base.alive=false; concludeGame(state, attackerId, zone, "destruction"); }
}
 
function countAliveUnits(state,pid){ return state.players[pid].units.filter(Boolean).length; }
 
function concludeGame(state, attackerId, zone, cause){
  state.gameOver = true;
  const attacker = state.players[attackerId];
  const correct = attacker.secretTarget === zone;
  if(state.opts.victoryPoints){
    const s = [0,1].map(pid=>{
      let sc = 0;
      if(pid===attackerId) sc += correct ? 50 : -50;
      sc += state.players[pid].points;
      sc += 5*countAliveUnits(state,pid);
      return sc;
    });
    state.scoreBoard = s;
    if(s[0]===s[1]){ state.winner=null; state.winReason = `Égalité aux Points de Victoire (${s[0]} partout) !`; }
    else { state.winner = s[0]>s[1]?0:1; state.winReason = `Victoire aux Points de Victoire (${s[0]} contre ${s[1]}) — ${cause==="timeout"?"le temps est écoulé":`la ${ZONES[zone].name} de Joueur ${2-attackerId} est détruite`}.`; }
    return;
  }
  if(correct){
    state.winner = attackerId;
    state.winReason = cause==="timeout"
      ? `Au temps, Joueur ${attackerId+1} avait le plus endommagé la base qu'il devait détruire (${ZONES[zone].name}) !`
      : `Joueur ${attackerId+1} a détruit la base qu'il devait détruire (${ZONES[zone].name}) !`;
  } else {
    state.winner = 1-attackerId;
    state.winReason = cause==="timeout"
      ? `Au temps, Joueur ${attackerId+1} avait le plus endommagé ${ZONES[zone].name} — mais ce n'était pas sa cible (${ZONES[attacker.secretTarget].name}) : il perd !`
      : `Joueur ${attackerId+1} a détruit la mauvaise base (${ZONES[zone].name} au lieu de ${ZONES[attacker.secretTarget].name}) et perd la partie !`;
  }
}
 
function zoneRougeTick(state, pid){
  const pl = state.players[pid];
  for(let lane=0; lane<10; lane++){
    const unit = pl.units[lane];
    if(!unit) continue;
    if(unit.skipZR){ unit.skipZR=false; continue; }
    if(inOwnDangerZone(unit.pos, pid)){
      unit.pv -= 1;
      if(state.fx) state.fx.hits.add(pid+'_'+lane);
      if(unit.pv<=0) killUnit(state, pid, lane, false);
    }
  }
}
 
function moveAndFight(state, pid){
  const pl = state.players[pid];
  const dir = pid===0 ? 1 : -1;
  for(let lane=0; lane<10; lane++){
    let unit = pl.units[lane];
    if(!unit) continue;
    const stats = unitStats(unit);
    const range = effectiveRange(stats, unit);
    let steps = stats.move + (unit.tempMoveBonus||0);
    const startPos = unit.pos;
    while(steps>0){
      const t = findTarget(state, pid, lane);
      if(t && t.dist<=range) break;
      unit.pos += dir;
      if(unit.pos<0) unit.pos=0; if(unit.pos>BOARD_LEN-1) unit.pos=BOARD_LEN-1;
      steps--;
      if(unit.pos===0 || unit.pos===BOARD_LEN-1) break;
    }
    if(unit.pos!==startPos && state.fx) state.fx.moved.add(pid+'_'+lane);
    for(let a=0;a<stats.atk;a++){
      if(!pl.units[lane]) break;
      const t = findTarget(state, pid, lane);
      if(!t || t.dist>range) break;
      const roll = rollDice(state);
      if(roll.mult===0){ logMsg(state, `${stats.icon} <b>Joueur ${pid+1}</b> attaque mais rate son coup${roll.label}.`); continue; }
      const dmg = stats.dmg + (unit.tempDmgBonus||0) + (roll.bonus||0);
      if(state.fx) state.fx.attacking.add(pid+'_'+lane);
      noteCombatForMusic();
      if(t.type==="unit"){
        const oppUnit = state.players[1-pid].units[lane];
        const oppStats = unitStats(oppUnit);
        logMsg(state, `${stats.icon} <b>Joueur ${pid+1}</b> attaque ${oppStats.icon} de Joueur ${2-pid} pour ${dmg} dégâts${roll.label}.`);
        applyDamageToUnit(state, pid, lane, dmg);
      } else {
        applyDamageToBase(state, pid, t.zone, dmg);
      }
      if(state.gameOver) return;
    }
  }
  pl.units.forEach(u=>{ if(u){ u.tempDmgBonus=0; u.tempMoveBonus=0; u.tempRangeBonus=0; } });
}
 
function startTurn(state, pid){
  zoneRougeTick(state, pid);
  const pl = state.players[pid];
  if(pl.hand.length<8){ drawCard(state, pid); state.pendingExchanges = 1; }
  else { state.pendingExchanges = 2; }
  state.actionTaken = false;
  pl.units.forEach(u=>{ if(u) u.usedAbility=false; });
}
 
function performExchange(state, pid, handIndex, source, riverIndex){
  const pl = state.players[pid];
  if(state.pendingExchanges<=0) return false;
  if(handIndex<0 || handIndex>=pl.hand.length) return false;
  const outgoing = pl.hand[handIndex];
  let incoming = null;
  if(source==='pioche'){
    if(state.deck.length===0) return false;
    incoming = state.deck.pop();
    state.deck.unshift(outgoing);
  } else if(source==='river'){
    if(riverIndex<0 || riverIndex>=state.river.length || !state.river[riverIndex]) return false;
    incoming = state.river[riverIndex];
    state.river[riverIndex] = outgoing;
  } else return false;
  pl.hand.splice(handIndex,1,incoming);
  state.pendingExchanges--;
  logMsg(state, `<b>Joueur ${pid+1}</b> échange une carte (${source==='pioche'?'avec la pioche':'avec la rivière'}).`);
  return true;
}
 
function endTurn(state){
  const pid = state.active;
  moveAndFight(state, pid);
  if(state.gameOver) return;
  state.active = 1-state.active;
  if(state.active===0) state.round++;
  startTurn(state, state.active);
  if(state.mode==="2p") state.pendingHandoff = true;
}
 
function timeoutConclude(state){
  if(state.gameOver) return;
  let worst = null;
  [0,1].forEach(pid=>{
    Object.entries(state.players[pid].bases).forEach(([zone,b])=>{
      if(!b.alive) return;
      if(!worst || b.pv < worst.pv) worst = {pid, zone, pv:b.pv};
    });
  });
  if(!worst){ state.gameOver=true; state.winner=null; state.winReason="Toutes les bases sont détruites au même moment."; return; }
  const attackerId = 1-worst.pid;
  logMsg(state, `⏱️ Le temps est écoulé — la ${ZONES[worst.zone].name} de Joueur ${worst.pid+1} est la plus endommagée.`);
  concludeGame(state, attackerId, worst.zone, "timeout");
}
 
/* ---------------- Capacités : exécution ---------------- */
function abilityInfo(archKey, lvl, troopKey){
  const a = ARCHETYPES[archKey];
  const needsTarget = (archKey==='renfort' && troopKey==='guerisseur');
  const name = (CAPACITY_NAMES[troopKey] && CAPACITY_NAMES[troopKey][archKey]) || a.name;
  return { name, freeDesc:a.freeDesc(lvl), paidDesc:a.paidDesc(lvl), paidCost:a.paidCost(lvl), needsTarget };
}
function useAbilityFree(state, pid, lane, archKey, targetLane){
  const pl=state.players[pid]; const u=pl.units[lane];
  if(!u || u.usedAbility || !u.abilities || !u.abilities.includes(archKey)) return;
  const lvl=u.level; const st=unitStats(u);
  const healTarget = (archKey==='renfort' && u.type==='guerisseur') ? targetLane : lane;
  logMsg(state, `<b>Joueur ${pid+1}</b> active la capacité libre <b>${CAPACITY_NAMES[u.type][archKey]}</b> (${st.icon} ${st.name}, Nv${lvl}).`);
  switch(archKey){
    case 'renfort': healUnit(state,pid,healTarget,lvl); break;
    case 'frappe': u.tempDmgBonus=(u.tempDmgBonus||0)+Math.ceil(lvl/2); break;
    case 'celerite': u.tempMoveBonus=(u.tempMoveBonus||0)+Math.ceil(lvl/2); break;
    case 'vigilance': u.skipZR=true; { const h=Math.floor(lvl/2); if(h>0) healUnit(state,pid,lane,h); } break;
    case 'rempart': u.shield=true; { const h=Math.floor(lvl/2); if(h>0) healUnit(state,pid,lane,h); } break;
  }
  u.usedAbility=true;
}
function useAbilityPaid(state, pid, lane, archKey, targetLane){
  const pl=state.players[pid]; const u=pl.units[lane];
  if(!u || u.usedAbility || !u.abilities || !u.abilities.includes(archKey)) return;
  const lvl=u.level; const cost = ARCHETYPES[archKey].paidCost(lvl);
  if(pl.points<cost || state.opts.noPoints) return;
  pl.points -= cost;
  const st=unitStats(u);
  const healTarget = (archKey==='renfort' && u.type==='guerisseur') ? targetLane : lane;
  logMsg(state, `<b>Joueur ${pid+1}</b> active la capacité payante <b>${CAPACITY_NAMES[u.type][archKey]}</b> (${st.icon} ${st.name}, Nv${lvl}, ${cost} PC).`);
  switch(archKey){
    case 'renfort': healUnit(state,pid,healTarget,2*lvl); break;
    case 'frappe': u.tempDmgBonus=(u.tempDmgBonus||0)+lvl; break;
    case 'celerite': u.tempMoveBonus=(u.tempMoveBonus||0)+lvl; break;
    case 'vigilance': u.skipZR=true; healUnit(state,pid,lane,lvl); break;
    case 'rempart': u.shield=true; healUnit(state,pid,lane,2*lvl); break;
  }
  u.usedAbility=true;
}
 
/* ---------------- Sorts : exécution ---------------- */
function castSpell(state, pid, spellKey, targetLane, targetZone){
  const pl = state.players[pid]; const spell = SPELLS[spellKey];
  if(state.opts.noPoints || pl.points<spell.cost) return;
  pl.points -= spell.cost;
  logMsg(state, `<b>Joueur ${pid+1}</b> lance le sort <b>${spell.name}</b> ${spell.icon}.`);
  switch(spellKey){
    case 'renfort': drawCard(state,pid); drawCard(state,pid); break;
    case 'levee': pl.points = Math.min(100, pl.points+8); break;
    case 'soins': healUnit(state,pid,targetLane,5); break;
    case 'marche': { const u=pl.units[targetLane]; if(u){ const dir=pid===0?1:-1; u.pos=Math.max(0,Math.min(BOARD_LEN-1,u.pos+dir*2)); } break; }
    case 'repli': { const u=pl.units[targetLane]; if(u){ const dir=pid===0?1:-1; u.pos=Math.max(0,Math.min(BOARD_LEN-1,u.pos-dir*2)); } break; }
    case 'bouclier': { const u=pl.units[targetLane]; if(u) u.shield=true; break; }
    case 'barrage': applyDamageToUnit(state, pid, targetLane, 3); noteCombatForMusic(); break;
    case 'sabotage': applyDamageToBase(state, pid, targetZone, 3); noteCombatForMusic(); break;
  }
}
 
/* ---------------- Bot AI ---------------- */
function botResolveExchanges(state){
  const pid = 1; const pl = state.players[pid];
  while(state.pendingExchanges>0){
    if(!pl.hand.length) break;
    // échange la carte la moins utile (une capacité/sort qu'il ne peut pas jouer, sinon la première carte)
    let idx = pl.hand.findIndex(k=>isCapacityCard(k) && !pl.units.some(u=>u&&u.type===CAPACITY_CARDS[k].troopKey));
    if(idx<0) idx = 0;
    const freeRiverSlot = state.river.findIndex(c=>c);
    if(freeRiverSlot>=0){ performExchange(state, pid, idx, 'river', freeRiverSlot); }
    else if(state.deck.length){ performExchange(state, pid, idx, 'pioche'); }
    else break;
  }
}
 
function botTakeAction(state){
  const pid = 1; const pl = state.players[pid];
  const active = new Set(pl.units.filter(Boolean).map(u=>u.type));
  const activeCount = pl.units.filter(Boolean).length;
  // tenter d'attacher une capacité disponible en main
  const capInHand = pl.hand.filter(k=>isCapacityCard(k));
  for(const k of capInHand){
    const meta = CAPACITY_CARDS[k];
    const lane = pl.units.findIndex(u=>u && u.type===meta.troopKey);
    if(lane>=0 && !pl.units[lane].abilities.includes(meta.archKey)){
      pl.hand.splice(pl.hand.indexOf(k),1);
      pl.units[lane].abilities.push(meta.archKey);
      logMsg(state, `<b>Joueur 2</b> attache la capacité ${meta.name}.`);
      break;
    }
  }
  // parfois, activer une capacité déjà attachée
  const withAbilities = pl.units.map((u,i)=>(u && u.abilities && u.abilities.length)?i:null).filter(v=>v!==null);
  if(withAbilities.length && Math.random()<0.5){
    const lane = withAbilities[Math.floor(Math.random()*withAbilities.length)];
    const archKey = pl.units[lane].abilities[0];
    useAbilityFree(state, pid, lane, archKey, lane);
  }
  if(!state.opts.simple){
    for(const lane of shuffle([...Array(10).keys()])){
      const u = pl.units[lane];
      if(u && pl.hand.includes(u.type) && u.copies<8){
        const idx = pl.hand.indexOf(u.type); pl.hand.splice(idx,1); u.copies++;
        const newLevel = computedLevel(state, u.copies);
        if(newLevel!==u.level){
          const oldMax = Math.round(TROOPS[u.type].pv*LEVEL_MULT[u.level]);
          const newMax = Math.round(TROOPS[u.type].pv*LEVEL_MULT[newLevel]);
          u.pv += (newMax-oldMax); u.level = newLevel;
        }
        logMsg(state, `<b>Joueur 2</b> renforce son ${TROOPS[u.type].name} (niveau ${u.level}).`);
        return;
      }
    }
  }
  const affordable = TROOP_KEYS.filter(k=>pl.hand.includes(k) && !active.has(k) && troopCost(state,k)<=pl.points)
                                .sort((a,b)=>TROOPS[b].cost-TROOPS[a].cost);
  if(affordable.length && activeCount<MAX_ACTIVE_TROOPS){
    const type = affordable[0];
    const emptyLanes = pl.units.map((u,i)=>u?null:i).filter(v=>v!==null);
    if(emptyLanes.length){
      const lane = emptyLanes[Math.floor(Math.random()*emptyLanes.length)];
      const copiesInHand = pl.hand.filter(c=>c===type).length;
      const toPlay = state.opts.simple ? copiesInHand : Math.min(copiesInHand, Math.random()<0.5?1:copiesInHand);
      for(let i=0;i<toPlay;i++) pl.hand.splice(pl.hand.indexOf(type),1);
      pl.points -= troopCost(state,type);
      const level = computedLevel(state, toPlay);
      const maxPv = Math.round(TROOPS[type].pv*LEVEL_MULT[level]);
      pl.units[lane] = {type, level, copies:toPlay, pv:maxPv, pos: BOARD_LEN-1, abilities: state.opts.simple ? ['renfort','frappe'] : []};
      logMsg(state, `<b>Joueur 2</b> déploie ${TROOPS[type].icon} ${TROOPS[type].name} (colonne ${LANE_LETTERS[lane]}).`);
      return;
    }
  }
  if(state.opts.noPoints){ drawCard(state,1); drawCard(state,1); logMsg(state, `<b>Joueur 2</b> pioche 2 cartes.`); return; }
  if(pl.points<20 || Math.random()<0.6){
    pl.points = Math.min(100, pl.points+5); logMsg(state, `<b>Joueur 2</b> engrange 5 Points de Combat.`);
  } else {
    drawCard(state,1); drawCard(state,1); logMsg(state, `<b>Joueur 2</b> pioche 2 cartes.`);
  }
}
function botPlayTurn(state){ startTurn(state, 1); botResolveExchanges(state); botTakeAction(state); endTurn(state); }

    <section id="r-variantes"><h3>10. Variantes <span class="badge official">Officiel</span> (combinables entre elles)</h3>
      <ul>
        <li><b>1 — Chronomètre</b> : une durée est fixée au départ. Si le temps s'écoule sans base détruite, la base la plus endommagée désigne le vainqueur (son adversaire gagne, sauf si ce n'était pas sa cible).</li>
        <li><b>2 — Hasard</b> : chaque attaque est précédée d'un jet de dé — 1 = coup raté (0 dégât), 2 à 5 = dégâts normaux, 6 = coup critique (+2 dégâts).</li>
        <li><b>3 — Points de Victoire</b> : en fin de partie, comptez +50 pts pour l'attaquant qui a détruit la bonne base (-50 si mauvaise base), +1 pt par PC restant, +5 pts par troupe encore sur le plateau. Le score le plus haut l'emporte — cela peut renverser le résultat "brut".</li>
        <li><b>4 — Sans Points de Combat</b> : les PC sont retirés du jeu, les troupes sont gratuites, mais les sorts et les capacités payantes deviennent injouables.</li>
        <li><b>5 — Simple</b> : toutes les troupes restent au niveau 1 (pas de montée de niveau), avec une composition de deck fixe (8 Éclaireurs, 7 Soldats, 6 Lanciers, 4 Guérisseurs, 4 Archers, 4 Barbares, 3 Cavaliers, 2 Cavaliers d'Élite, 1 Titan — pas de Catapulte) ; chaque troupe déployée reçoit d'office 2 capacités déjà attachées (Renfort + Frappe), et chaque joueur reçoit directement les 8 sorts en main.</li>
      </ul>
    </section>
 
    <section id="r-original"><h3>Texte original des règles <span class="badge official">Officiel</span></h3>
      <p style="color:var(--muted);">Reproduction intégrale du livret que tu as fourni, telle quelle, sans reformulation.</p>
 
      <h4 style="color:var(--brass);margin-top:18px;">1. Présentation & Objectif du jeu</h4>
      <p>In Front Of The Line est un jeu de stratégie pour 2 joueurs dans lequel vous devez capturer une des trois bases adverses.<br>
      En début de partie, chaque joueur choisit secrètement la base qu'il devra détruire.<br>
      Utilisez intelligemment vos troupes, leurs capacités spéciales ainsi que vos cartes de sorts. Gagnez des Points de Combat, améliorez vos troupes et carte après carte, construisez un arsenal imbattable, capable de vous faire remporter la partie !<br>
      L'objectif du jeu « In Front Of The Line » est de capturer la base adverse que vous aviez secrètement choisie avec le Jeton Base. Attention si vous détruisez une base mais que ce n'est pas celle que vous aviez choisie, vous perdez immédiatement la partie.</p>
 
      <h4 style="color:var(--brass);">2. Matériel</h4>
      <p>Le jeu contient :</p>
      <ul>
        <li>1 plateau « combat »</li>
        <li>2 mini-plateaux</li>
        <li>6 bases</li>
        <li>6 jetons base</li>
        <li>16 figurines</li>
        <li>150 cartes</li>
        <li>2 marqueurs de Points De Combats</li>
        <li>1 livret de règles</li>
        <li>22 marqueurs PV</li>
        <li>1 dé à 6 face (variante)</li>
      </ul>
 
      <h4 style="color:var(--brass);">3. Mise en place du jeu</h4>
      <ol>
        <li>Placez le plateau « combat » entre les 2 joueurs et les bases sur la dernière ligne de chaque camp</li>
        <li>Posez les 2 mini-plateaux de part et d'autre devant chaque joueurs</li>
        <li>Disposez les 150 cartes à côté du plateau « combat », et laissez un peu de place pour la défausse, à gauche du paquet</li>
        <li>Chaque joueur pose ses 8 figurines en haut du mini-plateau à l'endroit indiqué</li>
        <li>Chaque joueur met son pion marqueur sur la piste Points De Combats au nombre 10</li>
        <li>Chaque joueur place 8 pions PV à côté de lui : ils lui serviront à compter les points de vies de ses troupes et de ses bases tout au long de la partie. Chaque joueur place 3 pions PV sur la partie PV des bases, au nombre de PV max de la base</li>
        <li>Piochez les 4 premières cartes de la pioche et placez les côte à côte à côté de celle-ci.</li>
      </ol>
 
      <h4 style="color:var(--brass);">4. Les bases</h4>
      <p>Chaque joueur a 3 bases : une petite (40 PV/2 cases), une moyenne (60 PV/3 cases) et une grande (100 PV/5 cases). Chaque base met 1 dégât par ennemi dans la zone rouge.</p>
      <p>8. Chaque joueur choisit une base secrète et prend son jeton correspondant sans le montrer. Ce sera la base qu'il devra capturer.</p>
 
      <h4 style="color:var(--brass);">5. Présentation des troupes et de leurs niveaux</h4>
      <p>Voici le tableau des troupes et de leurs statistiques au niveau 1 :</p>
      <table class="ruletable"><tr><th>Troupes</th><th>PV</th><th>Attaque/Tour</th><th>Dégâts</th><th>Cases/Tour</th><th>Portée</th><th>Coût (en Points de Combats)</th></tr>
        <tr><td>Éclaireur</td><td>4</td><td>1</td><td>1</td><td>5</td><td>0</td><td>4</td></tr>
        <tr><td>Soldat</td><td>10</td><td>1</td><td>2</td><td>2</td><td>0</td><td>5</td></tr>
        <tr><td>Lancier</td><td>8</td><td>1</td><td>3</td><td>2</td><td>1</td><td>5</td></tr>
        <tr><td>Guérisseur</td><td>6</td><td>1</td><td>1</td><td>2</td><td>0</td><td>5</td></tr>
        <tr><td>Archer</td><td>6</td><td>2</td><td>2</td><td>1</td><td>4</td><td>6</td></tr>
        <tr><td>Barbare</td><td>9</td><td>1</td><td>4</td><td>2</td><td>0</td><td>7</td></tr>
        <tr><td>Cavalier</td><td>12</td><td>1</td><td>3</td><td>3</td><td>0</td><td>8</td></tr>
        <tr><td>Cavalier d'élite</td><td>18</td><td>1</td><td>4</td><td>1</td><td>0</td><td>9</td></tr>
        <tr><td>Catapulte</td><td>10</td><td>1</td><td>8</td><td>1</td><td>7</td><td>10</td></tr>
        <tr><td>Titan</td><td>24</td><td>1</td><td>6</td><td>1</td><td>0</td><td>14</td></tr>
      </table>
      <ul style="margin-top:10px;">
        <li>Une portée de 0 c'est une attaque au corps à corps ; sinon elle attaque à un nombre maximal de case de la troupe équivalente à sa portée</li>
        <li>Une troupe peut avoir 4 niveaux différents : le premier niveau, celui-ci, exige 1 exemplaire de la carte troupe pour être joué. Le deuxième niveau, quant à lui, exige 3 exemplaires de la carte troupe pour être joué. Le troisième niveau exige 5 exemplaires, et le niveau 4, 8 exemplaire.</li>
        <li>Le guérisseur ne paraît pas très puissant comme ça ; mais son intérêt est surtout dans ses capacités, Protégez le donc bien ! Il pourra bien souvent vous être utile...</li>
      </ul>
 
      <h4 style="color:var(--brass);">6. Déroulement d'un tour</h4>
      <p>Voici le déroulement d'un tour de « In Front Of The Line »</p>
      <ol>
        <li>Enlevez 1 PV à toute troupe sur le terrain qui se trouve dans la zone rouge adverse.</li>
        <li>Si vous avez moins de 8 cartes dans votre main piochez 1 carte. Échangez ensuite 1 carte avec la pioche (prenez la première carte de la pioche et échangez la avec la carte que vous voulez échanger) ou avec la rivière (échangez la carte de votre main avec l'une des 4 cartes de la rivière). Si vous avez 8 cartes ou plus dans votre main, ne piochez plus mais échangez 2 cartes de votre main avec la pioche, la rivière ou les 2.<br>
        <i>ex : j'ai 9 cartes dans ma main. Je dois donc échanger 2 troupes : je décide d'en échanger une avec la rivière et une avec la pioche. Mon adversaire, lui a 7 cartes, il pioche donc une carte et en échange une avec la pioche</i></li>
        <li>Faire l'une des 4 actions suivantes :
          <ul>
            <li>Gagner 5 Points De Combats, qui permettront d'acheter des troupes, des sorts et des capacités améliorées.</li>
            <li>Piocher 2 cartes, de la pioche, de la rivière ou des 2</li>
            <li>Poser une troupe : payez cette dernière puis posez le nombre d'exemplaire de la troupe que vous voulez sur le mini-plateau à l'endroit indiqué. placez ensuite son marqueur PV en fonction de son nombre de PV au niveau où il a été posé. Posez ensuite la figurine de votre troupe sur l'une des 10 colonnes (entre A et J). Je ne peut plus rejouer cette troupe tant que celle que je viens de poser n'est pas achevée<br>
            <i>ex : Je veut jouer 5 exemplaires du soldat. Je pose les 5 cartes soldat à l'endroit sur le mini-plateau où il y a indiqué « soldat ». Un soldat niveau 3 a 18 PV ; placez le marqueur PV du soldat sur 18. Je place la figurine du soldat sur la colonne C. Je ne peut plus rejouer de soldat tant que celui-ci n'est pas achevé.</i></li>
            <li>Poser une seule et unique carte sur une carte troupe déjà présente sur le mini-plateau, pour la faire augmenter de niveau ou simplement s'en rapprocher. Lorsqu'une troupe change de niveau ses capacités en changent aussi.<br>
            <i>ex : il y a 2 exemplaire du soldat sur le plateau. Je décide d'en poser un troisième : le soldat passe donc au niveau 2, et ses capacités passent également du niveau 1 au niveau 2</i></li>
          </ul>
        </li>
        <li>Déplacez TOUTES vos troupes sur le terrain avec un maximum de cases équivalent au nombre de cases /tour de votre troupe. Vous ne pouvez vous déplacer qu'en vertical uniquement : votre troupe ne pourra donc jamais changer de colonne. À ce moment là, les combats peuvent avoir lieu. On peut également traverser une case occupée par un allier<br>
        <i>ex : Mon soldat de niveau 2 est en C3 : je peux donc le déplacer de maximum 2 cases par tour.</i></li>
      </ol>
 
      <h4 style="color:var(--brass);">7. Les cartes capacités & cartes sorts</h4>
      <p>Les cartes capacités et les cartes sorts peuvent être jouées à n'importe quel moment durant votre tour. Lorsque vous jouez un sort, payez son coût en Point De Combat, montrez le à votre adversaire, puis appliquez son effet. Remettez le ensuite dans votre main. Avant de jouer une capacité spéciale, vérifiez que la troupe à qui appartient cette capacité spéciale est bien sur le terrain ; Sinon vous ne pouvez pas jouer cette capacité. Décidez ensuite si vous voulez jouer la partie libre ou la partie payante de la capacité, puis, si vous jouez la partie payante de la capacité, payez son coût en Points De Combats. Regardez ensuite le niveau de la troupe à laquelle cette capacité appartient. Appliquez son effet selon son niveau (si la troupe est de niveau 3 et que vous utilisez la capacité payante, utilisez la capacité du côté payant au niveau 3). Lorsque que vous jouez une capacité, placez la sous l'emplacement carte troupe, à qui appartient cette capacité.</p>
 
      <h4 style="color:var(--brass);">8. Les combats</h4>
      <p><b>Phase 1 : qui va t-on attaquer ?</b><br>
      Lorsqu'une troupe a une ou plusieurs troupes ennemies ou une base ennemie à portée, elle s'arrête immédiatement et peut attaquer.<br>
      Cette situation peut se produire :</p>
      <ul>
        <li>avant son déplacement</li>
        <li>pendant son déplacement</li>
        <li>après son déplacement.</li>
      </ul>
      <p>Si plusieurs cibles sont à portée, vous choisissez laquelle attaquer.<br>
      Une troupe attaque autant de fois par tour que l'indique sa caractéristique Attaques/Tour. Elle peut répartir ses attaques entre plusieurs cibles ou se focaliser sur une seule.</p>
      <p><b>Phase 2 : résolution des combats :</b><br>
      À chaque attaque, la cible perd un nombre de Points de Vie égal aux Dégâts de la troupe qui attaque.
      Déplacez ensuite son marqueur PV en conséquence.<br>
      <i>ex : L'Archer attaque le Cavalier, et lui met 6 dégâts. Le Cavalier bouge son marqueur de PV en conséquence</i></p>
      <p><b>Phase 3 : L'achèvement d'une troupe :</b><br>
      Lorsqu'une troupe tombe à 0 PV ou moins, elle est achevée.
      Retirez immédiatement sa figurine du terrain.
      Ensuite :</p>
      <ul>
        <li>retirez son marqueur PV ;</li>
        <li>défaussez toutes les capacités spéciales qui lui sont attachées ;</li>
        <li>défaussez toutes ses cartes troupe sauf une, qui retourne dans la main de son propriétaire.</li>
      </ul>
      <p>Le joueur adverse gagne ensuite un nombre de Points de Combat égal à deux fois le nombre d'exemplaires de cette troupe, dans la limite de 100 Points de Combat.<br>
      <i>Exemple : un Titan de 3 exemplaires est achevée. L'adversaire gagne 6 Points de Combat. S'il dépasse 100, son total reste limité à 100.</i></p>
 
      <h4 style="color:var(--brass);">9. Fin de partie</h4>
      <p>La fin de partie a lieu lorsque l'une des base est détruite. À ce moment là, tout les jetons bases sont révélés : si la base détruite était celle marqué sur le jeton base, choisi en début de partie, vous avez gagné ! Si en revanche la base que vous avez détruite n'est pas celle choisie sur le jeton base, vous avez perdu la partie et c'est votre adversaire qui gagne.<br>
      <i>ex : en début de partie, vous avez mis à côté de vous, votre jeton base moyenne. Vous avez détruite la base moyenne ; vous gagnez donc la partie. En revanche, si vous aviez détruit la petite base ou la grande base, vous auriez immédiatement perdu la partie</i></p>
 
      <h4 style="color:var(--brass);">10. Variantes</h4>
      <p>en voici 5 qui vous sont proposés mais vous pouvez en inventer vous même. Elles peuvent être combinés</p>
      <p><b>Variante 1 : avec un chronomètre :</b><br>
      Au début de la partie, mettez simplement un chronomètre. Si, à la fin de ce chronomètre, aucune base n'a été détruite, la base avec les PV les plus bas est désignée : le joueur qui l'a attaqué gagne la partie sauf s'il avait choisi une autre base<br>
      <i>ex : À la fin du chronomètre de 20 minutes, aucune base n'a été détruire. On regarde alors les PV des bases : la petite base du joueur 2 a les PV les plus bas avec 24 PV : le joueur 1 gagne donc la partie</i></p>
      <p><b>Variante 2 : avec un peu de hasard :</b><br>
      Même chose que les règles de base, sauf que lors des combats, à chaque attaque, on lance un dé : 1 : coup raté, 0 dégâts. 2-5 : dégâts normaux. 6 : dégâts critique : +2 dégâts.</p>
      <p><b>Variante 3 : avec des Points De Victoire :</b><br>
      À la fin de la partie, comptez les points ainsi :</p>
      <ul>
        <li>+50 points pour le gagnant (si vous avez détruit la base que vous vouliez)</li>
        <li>- 50 points si vous vous êtes trompés de base</li>
        <li>+1 point/ Point De Combat restant</li>
        <li>+5 Points/ troupes que vous avez sur le plateau en fin de partie</li>
      </ul>
      <p>Celui qui a le plus de points en fin de partie la gagne !</p>
      <p><b>Variante 4 : Sans Points De Combats :</b><br>
      Même chose, mais les Points De Combats sont retirés du jeu. Les capacités payantes ne peuvent en revanche pas être jouées</p>
      <p><b>Variante 5 : Simple :</b><br>
      Même chose mais toutes les cartes sont au niveau 1, ainsi que toutes les capacités. Il n'y a pas de possibilité d'augmenter de niveau. Placez 2 capacités par troupes, 8 sorts et le nombre de troupe suivant : 8 Éclaireurs, 7 Soldats, 6 Lanciers, 4 Guérisseurs, 4 Archers, 4 Barbares, 3 Cavaliers, 2 Cavaliers D'Élite et 1 seul Titan.</p>
    </section>
  </div>`;
  app.innerHTML = html;
}

function pickMode(m){ UI.mode=m; render(); }
function afterP1Target(){
  if(UI.mode==="bot"){ UI.p2Target = ["small","medium","large"][Math.floor(Math.random()*3)]; launchGame(); }
  else { UI.setupStep="p2handoff"; render(); }
}
function launchGame(){
  STATE = makeGame(UI.mode, UI.opts, UI.p1Target, UI.p2Target);
  botTurnScheduled = false;
  startTurn(STATE, 0);
  UI.screen="game";
  if(UI.mode==="2p") STATE.pendingHandoff = true;
  if(STATE.opts.timer){
    TIMER_HANDLE = setInterval(()=>{
      if(!STATE || STATE.gameOver) return;
      STATE.timerSeconds--;
      if(STATE.timerSeconds<=0){ STATE.timerSeconds=0; timeoutConclude(STATE); }
      render();
    },1000);
  }
  render();
}

function fmtTimer(s){ const m=Math.floor(s/60), r=s%60; return `${m}:${r.toString().padStart(2,'0')}`; }
 
function renderGame(){
  const pid = STATE.active; const pl = STATE.players[pid];
  let html = `<header class="top">
    <div class="brand"><h1>In Front Of The Line</h1><p>Champ de bataille tactique</p></div>
    <div class="turnbadge p${pid+1}"><span class="dot"></span><b>Tour de Joueur ${pid+1}</b><span class="round">Manche ${STATE.round}</span>
    ${STATE.opts.timer?`<span class="timer ${STATE.timerSeconds<=30?'warn':''}">⏱️ ${fmtTimer(STATE.timerSeconds)}</span>`:''}</div>
    ${musicButtonHtml()}
    <button class="btn secondary small" onclick="UI.screen='recap';render()">🗒️ Récap</button>
    <button class="btn secondary small" onclick="UI.screen='rules';render()">📖 Règles</button>
  </header>`;
  html += `<div class="game">`;
  html += `<div class="panels">${playerPanel(0)}${playerPanel(1)}</div>`;
  html += boardHtml();
  html += `<div class="actionzone">`;
  if(pl.isBot){ html += `<h3>Joueur 2 (bot) réfléchit…</h3>`; }
  else {
    html += exchangePanelHtml();
    html += `<h3>Votre main — Joueur ${pid+1}</h3><div class="hand ${STATE.fx && STATE.fx.drew.has(pid)?'hand-drawn':''}">${handHtml(pl)}</div>`;
    html += actionButtons();
    html += actionSubpanel();
  }
  html += `<h3 style="margin-top:14px;">Journal de bataille</h3><div class="log">${STATE.log.map((l,i)=>`<div style="${i===0?'animation:fadeSlide .3s ease;':''}">${l}</div>`).join("")}</div>`;
  if(!pl.isBot){ html += `<div class="endturn"><button class="btn" ${STATE.actionTaken?'':'disabled'} onclick="playerEndTurn()">Terminer le tour ▶</button></div>`; }
  html += `</div></div>`;
  app.innerHTML = html;
  if(pl.isBot && !STATE.gameOver && !botTurnScheduled){
    botTurnScheduled = true;
    setTimeout(()=>{
      botTurnScheduled = false;
      if(STATE && !STATE.gameOver && STATE.active===1 && STATE.players[1].isBot){
        botPlayTurn(STATE);
        triggerShake();
      }
      render();
    }, 900);
  }
}
 
function triggerShake(){
  UI.shake = true;
  setTimeout(()=>{
    UI.shake=false;
    if(STATE) STATE.fx = { hits:new Set(), attacking:new Set(), moved:new Set(), baseHits:new Set(), blocked:new Set(), drew:new Set() };
    if(UI.screen!=="setup"&&UI.screen!=="rules"&&UI.screen!=="recap") render();
  }, 750);
}
function clearFxSoon(){
  setTimeout(()=>{
    if(STATE) STATE.fx = { hits:new Set(), attacking:new Set(), moved:new Set(), baseHits:new Set(), blocked:new Set(), drew:new Set() };
    if(UI.screen!=="setup"&&UI.screen!=="rules"&&UI.screen!=="recap") render();
  }, 750);
}
 
function playerEndTurn(){
  endTurn(STATE);
  UI.actionMode=null; UI.selType=null; UI.selLane=null; UI.reinfType=null;
  UI.capLane=null; UI.capArch=null; UI.capChoice=null; UI.capTargetLane=null;
  UI.selSpell=null; UI.spellTargetLane=null; UI.spellTargetZone=null;

function playerPanel(pid){
  const pl = STATE.players[pid]; const isActive = STATE.active===pid;
  return `<div class="pcard p${pid+1} ${isActive?'active':''}">
    <h3><span class="sw"></span>Joueur ${pid+1} ${pl.isBot?'(bot)':''}</h3>
    ${STATE.opts.noPoints?'':`<div class="pts">${pl.points} PC</div>`}
    <div class="bases">
      ${Object.entries(ZONES).map(([k,z])=>{
        const b = pl.bases[k]; const pct = Math.max(0,Math.round(100*b.pv/b.max));
        return `<div class="base-mini ${k}"><b>${z.name}</b>${b.pv}/${b.max}<div class="pvbar ${pct<30?'low':''}"><i style="width:${pct}%;"></i></div></div>`;
      }).join("")}

  </div>`;

function handHtml(pl){
  const counts = {}; pl.hand.forEach(c=>counts[c]=(counts[c]||0)+1);
  return Object.entries(counts).map(([key,n])=>{
    if(TROOPS[key]){
      const t = TROOPS[key];
      return `<div class="card" title="PV ${t.pv} · Dégâts ${t.dmg} · Coût ${STATE.opts.noPoints?'Gratuit':t.cost+' PC'}">
        <div class="ic">${t.icon}</div><b>${t.name}</b><small>x${n} · ${STATE.opts.noPoints?'Gratuit':t.cost+' PC'}</small>
      </div>`;
    } else if(isCapacityCard(key)){
      const meta = CAPACITY_CARDS[key];
      return `<div class="card spell" title="À attacher à votre ${TROOPS[meta.troopKey].name}">
        <div class="ic">🔗</div><b>${meta.name}</b><small>x${n} · Capacité</small>
      </div>`;
    } else {
      const s = SPELLS[key];
      return `<div class="card spell" title="${s.desc}">
        <div class="ic">${s.icon}</div><b>${s.name}</b><small>Sort · ${s.cost} PC</small>
      </div>`;
    }
  }).join("");
}
 
function actionButtons(){
  const gated = STATE.pendingExchanges>0;
  const disabled = (STATE.actionTaken || gated) ? 'disabled' : '';
  let html = `<div class="actions">`;
  if(!STATE.opts.noPoints) html += `<button class="btn secondary" ${disabled} onclick="doGainPoints()">💰 Gagner 5 PC</button>`;
  html += `<button class="btn secondary" ${disabled} onclick="doDrawTwo()">🃏 Piocher 2 cartes</button>`;
  html += `<button class="btn secondary" ${disabled} onclick="UI.actionMode='deploy';render()">⚔️ Déployer une troupe</button>`;
  if(!STATE.opts.simple) html += `<button class="btn secondary" ${disabled} onclick="UI.actionMode='reinforce';render()">⬆️ Renforcer une troupe</button>`;
  html += `</div>`;
  if(gated) html += `<p style="color:var(--warn);font-size:12px;margin:0 0 10px;">🔄 Échange obligatoire avant de choisir votre action (voir ci-dessus).</p>`;
  html += `<div class="actions2">
    ${STATE.opts.simple?'':`<button class="btn spellbtn" onclick="UI.actionMode='attach';render()">🔗 Attacher une capacité</button>`}
    <button class="btn spellbtn" onclick="UI.actionMode='capacity';render()">✨ Capacité de troupe</button>
    ${STATE.opts.noPoints?'':`<button class="btn spellbtn" onclick="UI.actionMode='spell';render()">🔮 Lancer un sort</button>`}
  </div>`;
  return html;
}
 
function exchangePanelHtml(){
  const pid = STATE.active; const pl = STATE.players[pid];
  if(STATE.pendingExchanges<=0) return "";
  let html = `<div class="subpanel"><h4>🔄 Pioche & Échange — ${STATE.pendingExchanges} échange${STATE.pendingExchanges>1?'s':''} restant${STATE.pendingExchanges>1?'s':''}</h4>
    <p style="font-size:12px;color:var(--muted);margin:0 0 8px;">Officiel : si votre main a moins de 8 cartes, vous piochez puis échangez 1 carte ; sinon vous n'en piochez pas mais échangez 2 cartes — avec la pioche ou avec la rivière (visible ci-dessous, commune aux deux joueurs).</p>
    <p style="font-size:12px;color:var(--muted);margin:0 0 6px;">Rivière :</p>
    <div class="hand">${STATE.river.map((c,i)=>c?riverCardHtml(c,i):'').join("")}</div>
    <p style="font-size:12px;color:var(--muted);margin:10px 0 6px;">Votre carte à échanger :</p>
    <div class="hand">${pl.hand.map((c,i)=>handCardHtmlSelectable(c,i)).join("")}</div>`;

    html += `<div class="row-inline" style="margin-top:8px;">

function riverCardHtml(key, i){
  const sel = UI.exchangeHandIndex!==null;
  const label = TROOPS[key] ? TROOPS[key].name : (isCapacityCard(key) ? CAPACITY_CARDS[key].name : SPELLS[key].name);

function doExchange(source, riverIndex){
  if(UI.exchangeHandIndex===null) return;
  performExchange(STATE, STATE.active, UI.exchangeHandIndex, source, riverIndex);

  render();

function doGainPoints(){
  const pl = STATE.players[STATE.active]; pl.points = Math.min(100, pl.points+5);
  logMsg(STATE, `<b>Joueur ${STATE.active+1}</b> engrange 5 Points de Combat.`);
  STATE.actionTaken = true; render();

  drawCard(STATE, STATE.active); drawCard(STATE, STATE.active);

function laneListHtml(pid, filterFn, selField, onclickFn){
  const pl = STATE.players[pid];
  const items = pl.units.map((u,i)=>u?{lane:i,unit:u}:null).filter(Boolean).filter(o=>filterFn(o));

  return `<div class="lanepick">${items.map(o=>{
    const t = TROOPS[o.unit.type];

  }).join("")}</div>`;

function actionSubpanel(){
  const pid = STATE.active; const pl = STATE.players[pid];
  const active = new Set(pl.units.filter(Boolean).map(u=>u.type));
 
  if(UI.actionMode==="deploy" && !STATE.actionTaken){
    const counts = {}; pl.hand.forEach(c=>counts[c]=(counts[c]||0)+1);

    if(activeCount>=MAX_ACTIVE_TROOPS){
      html += `<p style="color:var(--warn);font-size:13px;">Vous avez déjà ${MAX_ACTIVE_TROOPS} troupes sur le terrain — c'est le maximum officiel (8 figurines par joueur). Attendez qu'une troupe soit achevée avant d'en déployer une nouvelle.</p>`;

      html += `<div class="hand">${options.map(t=>`<div class="card ${UI.selType===t?'selected':''}" onclick="UI.selType='${t}';UI.selQty=1;render()">

    else {
      html += `<div class="hand">${opts.map(o=>{ const t = TROOPS[o.unit.type];
        return `<div class="card ${UI.reinfType===o.lane?'selected':''}" onclick="UI.reinfType=${o.lane};render()">

      }).join("")}</div>`;
      if(UI.reinfType!==null){
        html += `<div class="row-inline" style="margin-top:8px;">
