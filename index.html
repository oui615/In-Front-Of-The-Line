      }
    }
    html += `<div class="row-inline" style="margin-top:10px;"><button class="btn secondary" onclick="UI.actionMode=null;UI.selSpell=null;UI.spellTargetLane=null;UI.spellTargetZone=null;render()">Fermer</button></div>`;
    html += `</div>`; return html;
  }
 
  return "";
}
 
function triggerAbility(kind, lane, archKey){
  const pid = STATE.active;
  if(kind==='free'){ useAbilityFree(STATE, pid, lane, archKey, lane); UI.actionMode=null; }
  else if(kind==='paid'){ useAbilityPaid(STATE, pid, lane, archKey, lane); UI.actionMode=null; }
  else { UI.capLane=lane; UI.capArch=archKey; UI.capChoice=kind; }
  render();
}
function chooseCapTarget(targetLane){
  const pid = STATE.active;
  if(UI.capChoice==='freeTarget') useAbilityFree(STATE, pid, UI.capLane, UI.capArch, targetLane);
  else useAbilityPaid(STATE, pid, UI.capLane, UI.capArch, targetLane);
  UI.capLane=null; UI.capArch=null; UI.capChoice=null; UI.capTargetLane=null;
  render();
}
function confirmAttach(capKey, lane){
  const pid = STATE.active; const pl = STATE.players[pid];
  const meta = CAPACITY_CARDS[capKey]; const u = pl.units[lane];
  if(!u || u.type!==meta.troopKey || u.abilities.includes(meta.archKey)) return;
  pl.hand.splice(pl.hand.indexOf(capKey),1);
  u.abilities.push(meta.archKey);
  logMsg(STATE, `<b>Joueur ${pid+1}</b> attache la capacité <b>${meta.name}</b> à sa troupe en colonne ${LANE_LETTERS[lane]}.`);
  UI.actionMode=null;
  render();
}
function chooseSpellAllyTarget(lane){ UI.spellTargetLane=lane; render(); }
 
function confirmSpell(){
  castSpell(STATE, STATE.active, UI.selSpell, UI.spellTargetLane, UI.spellTargetZone);
  UI.actionMode=null; UI.selSpell=null; UI.spellTargetLane=null; UI.spellTargetZone=null;
  render();
  clearFxSoon();
}
 
function confirmDeploy(){
  const pid = STATE.active; const pl = STATE.players[pid];
  const type = UI.selType, lane = UI.selLane;
  const qty = STATE.opts.simple ? pl.hand.filter(c=>c===type).length : UI.selQty;
  for(let i=0;i<qty;i++) pl.hand.splice(pl.hand.indexOf(type),1);
  pl.points -= troopCost(STATE,type);
  const level = computedLevel(STATE, qty);
  const maxPv = Math.round(TROOPS[type].pv*LEVEL_MULT[level]);
  pl.units[lane] = {type, level, copies:qty, pv:maxPv, pos: pid===0?0:BOARD_LEN-1, abilities: STATE.opts.simple ? ['renfort','frappe'] : []};
  logMsg(STATE, `<b>Joueur ${pid+1}</b> déploie ${TROOPS[type].icon} ${TROOPS[type].name} (x${qty}, Nv${level}) en colonne ${LANE_LETTERS[lane]}.`);
  STATE.actionTaken = true; UI.actionMode=null; UI.selType=null; UI.selLane=null;
  render();
}
 
function confirmReinforce(lane){
  const pid = STATE.active; const pl = STATE.players[pid]; const u = pl.units[lane];
  pl.hand.splice(pl.hand.indexOf(u.type),1); u.copies++;
  const newLevel = computedLevel(STATE, u.copies);
  if(newLevel!==u.level){
    const oldMax = Math.round(TROOPS[u.type].pv*LEVEL_MULT[u.level]);
    const newMax = Math.round(TROOPS[u.type].pv*LEVEL_MULT[newLevel]);
    u.pv += (newMax-oldMax); u.level = newLevel;
  }
  logMsg(STATE, `<b>Joueur ${pid+1}</b> renforce ${TROOPS[u.type].name} en colonne ${LANE_LETTERS[lane]} (Nv${u.level}, x${u.copies}).`);
  STATE.actionTaken = true; UI.actionMode=null; UI.reinfType=null;
  render();
}
 
function boardHtml(){
  let html = `<div class="board-wrap ${UI.shake?'screen-shake':''}">
    <div class="legend">
      <span><i class="box" style="background:#4aa863;"></i>Petite base</span>
      <span><i class="box" style="background:#428ce0;"></i>Base moyenne</span>
      <span><i class="box" style="background:#db4545;"></i>Grande base</span>
      <span><i class="box" style="background:rgba(217,164,65,.5);"></i>Zone rouge (4 cases)</span>
      <span><i class="box" style="background:transparent;box-shadow:0 0 0 2px var(--spell);"></i>Bouclier actif</span>
    </div>
    <div class="board">`;
  html += `<div class="cornercell"></div>` + baseRowHtml(1);
  html += `<div class="cornercell"></div>` + LANE_LETTERS.map(L=>`<div class="colhead">${L}</div>`).join("");
  for(let p=BOARD_LEN-1; p>=0; p--){
    html += `<div class="rowlabel">${p}</div>`;
    for(let lane=0; lane<10; lane++){
      let cls = "cell";
      if(p<=ZR_DEPTH-1) cls+=" zr-bot";
      if(p>=BOARD_LEN-ZR_DEPTH) cls+=" zr-top";
      if(p===Math.floor(BOARD_LEN/2)-1) cls+=" mid";
      html += `<div class="${cls}">${cellUnitsHtml(lane,p)}</div>`;
    }
  }
  html += `<div class="cornercell"></div>` + LANE_LETTERS.map(L=>`<div class="colhead">${L}</div>`).join("");
  html += `<div class="cornercell"></div>` + baseRowHtml(0);
  html += `</div></div>`;
  return html;
}
 
function baseRowHtml(pid){
  const pl = STATE.players[pid]; let html = "";
  Object.entries(ZONES).forEach(([k,z])=>{
    const b = pl.bases[k]; const pct = Math.max(0,Math.round(100*b.pv/b.max));
    const fxHit = STATE.fx && STATE.fx.baseHits.has(pid+'_'+k);
    html += `<div class="baserow ${k} ${fxHit?'base-hit':''}" style="grid-column: span ${z.lanes.length};">
      <b>${z.name} · J${pid+1}</b>${b.pv}/${b.max} PV
      <div class="pvbar ${pct<30?'low':''}"><i style="width:${pct}%;"></i></div>
    </div>`;
  });
  return html;
}
 
function cellUnitsHtml(lane,pos){
  let html = "";
  for(const pid of [0,1]){
    const u = STATE.players[pid].units[lane];
    if(u && u.pos===pos){
      const stats = unitStats(u);
      const key = pid+'_'+lane;
      const fx = STATE.fx || {};
      const cls = [
        u.shield?'shielded':'',
        fx.hits && fx.hits.has(key) ? 'unit-hit' : '',
        fx.attacking && fx.attacking.has(key) ? 'unit-attack' : '',
        fx.moved && fx.moved.has(key) ? 'unit-moved' : '',
        fx.blocked && fx.blocked.has(key) ? 'unit-blocked' : '',
      ].filter(Boolean).join(' ');
      html += `<div class="unit p${pid+1} ${cls}" title="${stats.name} Nv${u.level} — ${u.pv}/${stats.maxPv} PV${u.shield?' · Bouclier actif':''}">
        <span class="lvl">${u.level}</span>${stats.icon}<span class="pv">${u.pv}</span></div>`;
    }
  }
  return html;
}
 
function initEmbers(){
  const host = document.getElementById('embers');
  if(!host) return;
  const N = 22;
  for(let i=0;i<N;i++){
    const d = document.createElement('div');
    d.className = 'ember-dot';
    const left = Math.random()*100;
    const dur = 9 + Math.random()*10;
    const delay = -Math.random()*dur;
    const drift = (Math.random()*60-30).toFixed(0)+'px';
    const size = (2+Math.random()*3).toFixed(1)+'px';
    d.style.left = left+'%';
    d.style.width = size; d.style.height = size;
    d.style.setProperty('--drift', drift);
    d.style.animationDuration = dur+'s';
    d.style.animationDelay = delay+'s';
    host.appendChild(d);
  }
}
initEmbers();
 
/* ============================================================
   Musique procédurale adaptative — 3 ambiances (Web Audio API,
   aucun fichier audio externe, donc aucun souci de droits) :
   - "ambiance" : nappe calme + carillon épars, presque sans percussion
   - "suspens"  : nappe tendue, battement de cœur, tic-tac irrégulier
                  et montées de cordes dissonantes, déclenchée quand
                  une base est très endommagée ou le chronomètre proche de zéro
   - "guerre"   : tambours de bataille complets, charleston, impacts
                  et masse de cors, déclenchée par les combats
   ============================================================ */
let audioCtx = null;
let musicTimer = null;
let musicStep = 0;
let musicMode = 'ambiance'; // 'ambiance' | 'suspense' | 'guerre'
let combatMusicUntil = 0;
 
function ensureAudioCtx(){
  if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  return audioCtx;
}
 
function playKick(t, soft){
  const ctx = audioCtx;
  const osc = ctx.createOscillator(); const gain = ctx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(soft?110:150,t);
  osc.frequency.exponentialRampToValueAtTime(soft?38:45,t+0.16);
  gain.gain.setValueAtTime(soft?0.4:0.85,t);
  gain.gain.exponentialRampToValueAtTime(0.001,t+(soft?0.3:0.22));
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t); osc.stop(t+0.32);
}
function playImpactBoom(t){
  const ctx = audioCtx;
  const osc = ctx.createOscillator(); const gain = ctx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(95,t);
  osc.frequency.exponentialRampToValueAtTime(30,t+0.5);
  gain.gain.setValueAtTime(1.0,t);
  gain.gain.exponentialRampToValueAtTime(0.001,t+0.65);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t); osc.stop(t+0.7);
  playNoiseHit(t, 0.22);
}
function playTomHit(t, low){
  const ctx = audioCtx;
  const osc = ctx.createOscillator(); const gain = ctx.createGain();
  osc.type='triangle';
  const base = low? 110: 160;
  osc.frequency.setValueAtTime(base,t);
  osc.frequency.exponentialRampToValueAtTime(base*0.6,t+0.18);
  gain.gain.setValueAtTime(0.35,t);
  gain.gain.exponentialRampToValueAtTime(0.001,t+0.2);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t); osc.stop(t+0.22);
}
function playNoiseHit(t, vol){
  const ctx = audioCtx;
  const size = Math.floor(ctx.sampleRate*0.14);
  const buffer = ctx.createBuffer(1,size,ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<size;i++) data[i]=(Math.random()*2-1)*(1-i/size);
  const src = ctx.createBufferSource(); src.buffer=buffer;
  const filter = ctx.createBiquadFilter(); filter.type='highpass'; filter.frequency.value=1200;
  const gain = ctx.createGain(); gain.gain.setValueAtTime(vol,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.13);
  src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  src.start(t);
}
function playHiHat(t, vol){
  const ctx = audioCtx;
  const size = Math.floor(ctx.sampleRate*0.05);
  const buffer = ctx.createBuffer(1,size,ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<size;i++) data[i]=(Math.random()*2-1)*(1-i/size);
  const src = ctx.createBufferSource(); src.buffer=buffer;
  const filter = ctx.createBiquadFilter(); filter.type='highpass'; filter.frequency.value=6500;
  const gain = ctx.createGain(); gain.gain.setValueAtTime(vol,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.045);
  src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  src.start(t);
}
function playHornSwell(t, quiet){
  const ctx = audioCtx;
  [98,147].forEach((freq,i)=>{
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type='sawtooth'; osc.frequency.setValueAtTime(freq,t);
    const filter = ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=420;
    const peak = (i===0?0.07:0.035) * (quiet?0.5:1);
    gain.gain.setValueAtTime(0,t);
    gain.gain.linearRampToValueAtTime(peak, t+1.6);
    gain.gain.linearRampToValueAtTime(0, t+4.5);
    osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    osc.start(t); osc.stop(t+4.6);
  });
}
function playTenseSting(t){
  const ctx = audioCtx;
  [220, 233].forEach((freq)=>{ // seconde mineure dissonante
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type='sine'; osc.frequency.setValueAtTime(freq,t);
    gain.gain.setValueAtTime(0,t);
    gain.gain.linearRampToValueAtTime(0.045, t+0.08);
    gain.gain.exponentialRampToValueAtTime(0.001, t+1.4);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t); osc.stop(t+1.5);
  });
}
function playTick(t){
  const ctx = audioCtx;
  const osc = ctx.createOscillator(); const gain = ctx.createGain();
  osc.type='square'; osc.frequency.setValueAtTime(1300,t);
  gain.gain.setValueAtTime(0.05,t);
  gain.gain.exponentialRampToValueAtTime(0.001,t+0.04);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t); osc.stop(t+0.05);
}
function playStringSwell(t){
  const ctx = audioCtx;
  [220, 227, 330].forEach((freq,i)=>{ // masse dissonante et tendue
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type='sawtooth'; osc.frequency.setValueAtTime(freq,t);
    const filter = ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=900;
    const peak = 0.028 - i*0.006;
    gain.gain.setValueAtTime(0,t);
    gain.gain.linearRampToValueAtTime(peak, t+1.8);
    gain.gain.linearRampToValueAtTime(0, t+3.6);
    osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    osc.start(t); osc.stop(t+3.7);
  });
}
const CHIME_RATIOS = [1, 1.125, 1.333, 1.5, 1.667]; // gamme pentatonique relative
function playChime(t){
  const ctx = audioCtx;
  const ratio = CHIME_RATIOS[Math.floor(Math.random()*CHIME_RATIOS.length)];
  const freq = 49 * 8 * ratio; // 3 octaves au-dessus du bourdon, registre "carillon"
  const osc = ctx.createOscillator(); const gain = ctx.createGain();
  osc.type='sine'; osc.frequency.setValueAtTime(freq,t);
  const filter = ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=3000;
  gain.gain.setValueAtTime(0,t);
  gain.gain.linearRampToValueAtTime(0.05, t+0.05);
  gain.gain.exponentialRampToValueAtTime(0.001, t+2.2);
  osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  osc.start(t); osc.stop(t+2.3);
}
 
function musicScheduleStep(){
  const ctx = ensureAudioCtx();
  const t = ctx.currentTime + 0.03;
  const beat = musicStep % 16;
  if(musicMode==='guerre'){
    if(beat===0) playImpactBoom(t); else if(beat===8) playKick(t);
    if(beat===6) playKick(t);
    if(beat===4 || beat===12) playTomHit(t, beat===12);
    if(beat===10) playNoiseHit(t, 0.18);
    if(beat%2===1) playHiHat(t, beat===15?0.12:0.07);
    if(musicStep % 32 === 0) playHornSwell(t);
  } else if(musicMode==='suspense'){
    if(beat===0) playKick(t, true);
    if(musicStep % 24 === 3) playTenseSting(t);
    if(Math.random()<0.05) playTick(t);
    if(musicStep % 48 === 20 && Math.random()<0.6) playStringSwell(t);
  } else { // ambiance
    if(musicStep % 64 === 0) playHornSwell(t, true);
    if(musicStep % 20 === 7 && Math.random()<0.45) playChime(t);
  }
  musicStep++;
}
 
let droneOsc1=null, droneOsc2=null, droneOsc3=null, droneLFO=null, droneGain=null, droneGain3=null, droneLfoGain=null, droneFilter=null;
function startDrone(){
  const ctx = ensureAudioCtx();
  droneGain = ctx.createGain(); droneGain.gain.value = 0;
  droneGain3 = ctx.createGain(); droneGain3.gain.value = 0;
  droneFilter = ctx.createBiquadFilter(); droneFilter.type='lowpass'; droneFilter.frequency.value=260;
  droneOsc1 = ctx.createOscillator(); droneOsc1.type='sawtooth'; droneOsc1.frequency.value=49; // sol grave
  droneOsc2 = ctx.createOscillator(); droneOsc2.type='sine'; droneOsc2.frequency.value=49*1.5; // quinte, calme
  droneOsc3 = ctx.createOscillator(); droneOsc3.type='sawtooth'; droneOsc3.frequency.value=49*2.005; // masse "chœur de guerre", légèrement désaccordée
  droneLFO = ctx.createOscillator(); droneLFO.type='sine'; droneLFO.frequency.value=0.07; // souffle très lent
  droneLfoGain = ctx.createGain(); droneLfoGain.gain.value=0.018;
  droneLFO.connect(droneLfoGain); droneLfoGain.connect(droneGain.gain);
  droneOsc1.connect(droneFilter); droneOsc2.connect(droneFilter);
  droneOsc3.connect(droneGain3); droneGain3.connect(droneFilter);
  droneFilter.connect(droneGain); droneGain.connect(ctx.destination);
  droneOsc1.start(); droneOsc2.start(); droneOsc3.start(); droneLFO.start();
  applyDroneToneForMode(musicMode, true);
}
function stopDrone(){
  if(!audioCtx) return;
  const ctx = audioCtx; const t = ctx.currentTime;
  if(droneGain) droneGain.gain.linearRampToValueAtTime(0, t+1);
  [droneOsc1, droneOsc2, droneOsc3, droneLFO].forEach(osc=>{ if(osc){ try{ osc.stop(t+1.1); }catch(e){} } });
  droneOsc1=droneOsc2=droneOsc3=droneLFO=droneGain=droneGain3=droneLfoGain=droneFilter=null;
}
function applyDroneToneForMode(mode, initial){
  if(!droneGain || !audioCtx) return;
  const ctx = audioCtx; const t = ctx.currentTime; const ramp = initial? 2.5 : 1.8;
  if(mode==='suspense'){
    droneOsc2.frequency.setTargetAtTime(49*1.06, t, 1.2); // seconde mineure : malaise
    droneLFO.frequency.setTargetAtTime(0.35, t, 1.0);
    droneLfoGain.gain.setTargetAtTime(0.03, t, 1.0);
    droneFilter.frequency.setTargetAtTime(340, t, 1.2);
    droneGain.gain.linearRampToValueAtTime(0.05, t+ramp);
    droneGain3.gain.linearRampToValueAtTime(0, t+ramp);
  } else if(mode==='guerre'){
    droneOsc2.frequency.setTargetAtTime(49*1.5, t, 1.2); // quinte franche
    droneLFO.frequency.setTargetAtTime(0.12, t, 1.0);
    droneLfoGain.gain.setTargetAtTime(0.02, t, 1.0);
    droneFilter.frequency.setTargetAtTime(320, t, 1.2);
    droneGain.gain.linearRampToValueAtTime(0.055, t+ramp);
    droneGain3.gain.linearRampToValueAtTime(0.035, t+ramp); // masse de chœur audible en guerre
  } else { // ambiance
    droneOsc2.frequency.setTargetAtTime(49*1.5, t, 1.2);
    droneLFO.frequency.setTargetAtTime(0.07, t, 1.0);
    droneLfoGain.gain.setTargetAtTime(0.018, t, 1.0);
    droneFilter.frequency.setTargetAtTime(260, t, 1.2);
    droneGain.gain.linearRampToValueAtTime(0.04, t+ramp);
    droneGain3.gain.linearRampToValueAtTime(0, t+ramp);
  }
}
function setMusicMode(mode){
  if(mode===musicMode) return;
  musicMode = mode;
  applyDroneToneForMode(mode, false);
}
function noteCombatForMusic(){
  combatMusicUntil = Date.now() + 6000;
}
function computeDesiredMusicMode(){
  if(UI.musicPreference && UI.musicPreference!=='auto') return UI.musicPreference;
  if(!STATE || UI.screen!=="game" || STATE.gameOver) return 'ambiance';
  if(Date.now() < combatMusicUntil) return 'guerre';
  let tense = STATE.opts.timer && STATE.timerSeconds!=null && STATE.timerSeconds<=20;
  if(!tense){
    outer: for(const pid of [0,1]){
      for(const b of Object.values(STATE.players[pid].bases)){
        if(b.alive && b.pv/b.max<=0.25){ tense=true; break outer; }
      }
    }
  }
  return tense ? 'suspense' : 'ambiance';
}
function updateMusicMode(){
  if(!UI.musicOn || !audioCtx) return;
  const desired = computeDesiredMusicMode();
  if(desired!==musicMode) setMusicMode(desired);
}
function setMusicPreference(value){
  UI.musicPreference = value;
  if(UI.musicOn && audioCtx) setMusicMode(computeDesiredMusicMode());
  render();
}
 
function startMusic(){
  const ctx = ensureAudioCtx();
  if(ctx.state==='suspended') ctx.resume();
  musicStep = 0;
  musicMode = computeDesiredMusicMode();
  startDrone();
  musicScheduleStep();
  const bpm = 78; const stepMs = (60/bpm/2)*1000;
  musicTimer = setInterval(()=>{ updateMusicMode(); musicScheduleStep(); }, stepMs);
}
function stopMusic(){
  if(musicTimer){ clearInterval(musicTimer); musicTimer=null; }
  stopDrone();
}
function toggleMusic(){
  UI.musicOn = !UI.musicOn;
  if(UI.musicOn) startMusic(); else stopMusic();
  render();
}
function musicButtonHtml(){
  const label = UI.musicOn ? {ambiance:'🔊 Ambiance',suspense:'🔊 Suspens',guerre:'🔊 Guerre'}[musicMode] : "🔇 Musique";
  const options = [
    {v:'auto', t:'🎲 Aléatoire'},
    {v:'ambiance', t:'Ambiance'},
    {v:'suspense', t:'Suspens'},
    {v:'guerre', t:'Guerre'},
  ];
  const select = `<select onchange="setMusicPreference(this.value)" style="background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 6px;font-family:'Rajdhani',sans-serif;font-size:12.5px;">
    ${options.map(o=>`<option value="${o.v}" ${UI.musicPreference===o.v?'selected':''}>${o.t}</option>`).join('')}
  </select>`;
  return `<button class="btn secondary small" onclick="toggleMusic()">${label}</button>${select}`;
}
 
render();
</script>
